openspec: '1.0'
story:
  id: US-001
  title: Register Account Using Email or Mobile
  description: Enables new users to create an account using either an email address
    or a mobile number as an identifier. Includes input validation and checks for
    uniqueness.
  feature:
    id: F-01
    title: User Registration and Account Creation
  epic:
    id: EP-001
    title: User Account Registration via Email and Mobile
  status: draft
functional_requirement:
  description: "## S-001\n\n### Purpose\n\nThis functional specification defines requirements\
    \ for enabling new users to register an account using either an email address\
    \ or a mobile phone number, ensuring data format validation and uniqueness checks\
    \ as part of the User Account Management Service.\n\n### Scope\n\nThe specification\
    \ covers the registration capability of the User Account Management Service, specifically\
    \ the process of accepting user registration requests, validating email/mobile\
    \ input, enforcing uniqueness, and providing user-facing feedback for both success\
    \ and error conditions.\n\n### Non-Goals\n\n1. Password setting or authentication\
    \ flows post-registration initiation\n2. Management of user profile fields beyond\
    \ the chosen identifier\n3. Two-factor authentication or OTP verification ([NEEDS\
    \ CLARIFICATION: Is OTP required at registration?] (Assumed: Not required for\
    \ this story.))\n4. Support for social login or third-party identity providers\n\
    5. Handling of language localization or internationalization\n6. Integration with\
    \ notification systems (email/SMS) for this registration step\n7. Registration\
    \ via user identifiers other than email/mobile\n8. Rate limiting or anti-abuse\
    \ functionality\n9. Customization of input validation formats by clients\n10.\
    \ Storage or management of user consents or preferences\n\n### Key Entities\n\n\
    - **UserRegistrationRequest**  \n  - identifier: string (email address or mobile\
    \ number)\n  \n- **UserAccount**  \n  - user_id: string  \n  - email: string (nullable)\
    \  \n  - mobile: string (nullable)\n  \nRelationship:  \n- UserRegistrationRequest\
    \ → UserAccount (0..1, by uniqueness constraint)\n\n### Functional Requirements\n\
    \nFR-001: User Account Management Service SHALL accept registration requests where\
    \ the identifier is either an email address or a mobile number. (P1)\n\nFR-002:\
    \ User Account Management Service SHALL validate that the submitted identifier\
    \ matches required syntactic format for email or mobile. (P1)\n\nFR-003: User\
    \ Account Management Service MUST NOT allow registration with identifiers (email\
    \ or mobile) already associated with an existing UserAccount. (P1)\n\nFR-004:\
    \ User Account Management Service SHALL provide a clear error message if the identifier\
    \ does not conform to required format. (P2)\n\nFR-005: User Account Management\
    \ Service SHALL provide a clear error message if the identifier is already registered.\
    \ (P2)\n\nFR-006: User Account Management Service SHOULD provide actionable feedback\
    \ when resubmitted data remains invalid or incomplete, indicating next steps or\
    \ specific issues. (P2)\n\nFR-007: User Account Management Service MAY allow the\
    \ user to correct input and resubmit the registration form after validation errors.\
    \ (P2)\n\nFR-008: User Account Management Service MUST NOT return details about\
    \ existing user accounts other than the fact that the identifier is already registered.\
    \ (P2)\n\nFR-009: User Account Management Service SHALL NOT accept registration\
    \ with both an email and a mobile in a single request. (P3)\n\n### Assumptions\
    \ Propagation\n\nA-001: Registration step does not require OTP or password input\
    \ at this stage. (FR-001, FR-002, FR-003)  \nA-002: Identifier must be either\
    \ a syntactically valid email or a regionally valid mobile number, but not both.\
    \ (FR-001, FR-002, FR-009)  \nA-003: System only checks uniqueness against exact-match\
    \ identifiers. (FR-003, FR-005, FR-008)\n\n### Success Criteria\n\nSC-001: Percentage\
    \ of successful registrations where identifier format is valid and not previously\
    \ registered equals 100%.\n\nSC-002: Presentation of precisely worded error messages\
    \ for all failed validation attempts is at least 98%.\n\nSC-003: The system prevents\
    \ creation of more than one account with the same identifier in all cases.\n\n\
    ### Priority Levels\n\n- Acceptance Criterion 1: Valid format and uniqueness check\
    \ (P1)\n- Acceptance Criterion 2: Duplicate identifier message (P2)\n- Acceptance\
    \ Criterion 3: Invalid format message (P2)\n- Acceptance Criterion 4: Error correction\
    \ flow and feedback (P2)\n\n### Edge Cases\n\nEC-001: Given a user submits an\
    \ empty identifier, When submission occurs, Then the system rejects the request\
    \ with a message \"Identifier required.\" (FR-002, FR-004)\n\nEC-002: Given a\
    \ user submits an email with invalid syntax (e.g. \"user@@domain\"), When submission\
    \ occurs, Then the system rejects with \"Invalid email format.\" (FR-002, FR-004)\n\
    \nEC-003: Given a user submits a mobile number in an unsupported format, When\
    \ submission occurs, Then the system rejects it as invalid and provides format\
    \ guidance. (FR-002, FR-004)\n\nEC-004: Given a submitted identifier matches an\
    \ existing account, When registration is attempted, Then the system rejects with\
    \ \"Identifier already registered.\" (FR-003, FR-005)\n\nEC-005: Given a registration\
    \ attempt where both email and mobile are provided in one request, When submission\
    \ occurs, Then the system rejects with a message to include only one identifier.\
    \ (FR-009)\n\nEC-006: Given the user encounters a validation error, When the identifier\
    \ is corrected and resubmitted, Then the system processes the new input and provides\
    \ success or new specific error messages as required. (FR-006, FR-007)\n\nEC-007:\
    \ Given a user repeatedly submits invalid data, When error messages are triggered,\
    \ Then the system continues to provide actionable, specific feedback on each attempt.\
    \ (FR-006)\n\n### Independent Testability\n\nPreconditions:\n1. No existing user\
    \ account with the test identifier.\n2. Identifier follows the required syntactic\
    \ format (valid email or mobile).\nUser Action: User submits the registration\
    \ form with the identifier.\nObservable Outcome: The system accepts the request\
    \ and registers the new user."
  acceptance_criteria:
  - given_when_then: Given a new user wants to register, When the user inputs an email
      address or mobile number, Then the system validates that the input matches the
      required format and is unique.
  - given_when_then: Given the input email or mobile is already registered, When the
      user submits the registration form, Then the user receives a message that the
      email or mobile is already registered.
  - given_when_then: Given the input email or mobile has an invalid format, When the
      user submits the registration form, Then the user receives a validation error
      message indicating the issue.
  - given_when_then: Given the registration form displays errors, When the user corrects
      and resubmits, Then the form provides clear feedback about the next steps or
      remaining issues.
  epic_acceptance_criteria:
  - given_when_then: Given a new user, when they register with a valid email or mobile,
      then an OTP is sent and the account is created upon successful validation.
  - given_when_then: Given a user attempts to register with an already-used email
      or mobile, then the system prompts that the email or mobile is already in use.
  - given_when_then: Given a user submits invalid email or mobile format, then the
      system displays an appropriate validation error.
  - given_when_then: Given a user fails OTP verification, then they are prevented
      from completing registration and can retry.
  - given_when_then: Given successful registration, then the user is redirected to
      the personalized dashboard or homepage.
technical_design:
  description: "## S-001\n\n---\n## 1. Contracts & Interfaces\n\n### 1.1. API Contract:\
    \ Registration Initiation\n\n- **Endpoint**: `POST /api/v1/register/initiate`\n\
    - **Request Payload**:\n  - `identifier` (string, required): Either a syntactically\
    \ valid email address or a regionally valid mobile number. MUST NOT include both.\n\
    - **Responses**:\n  - **201 Created**: Registration successfully initiated.\n\
    \    - Body: `{ user_id: string }`\n  - **400 Bad Request**: Input is missing,\
    \ invalid, or malformed.\n    - Possible messages:  \n      - \"Identifier required.\"\
    \ (For empty/undefined identifier)  \n      - \"Invalid email format.\"\n    \
    \  - \"Invalid mobile format. Mobile must be in E.164 format.\"\n      - \"Provide\
    \ either email or mobile, not both.\"\n  - **409 Conflict**: Identifier already\
    \ registered.\n    - Body: `{ message: \"Identifier already registered.\" }`\n\
    \  - **422 Unprocessable Entity**: Input supplied but not processable (e.g., ambiguous\
    \ or not parsable as either email or mobile).\n    - Body: `{ message: string\
    \ }`\n\n### 1.2. Data Model: UserAccount Table\n\n- **Table**: `user_accounts`\n\
    \  - `user_id` (UUID, PK, not null)\n  - `email` (varchar(320), unique, nullable)\n\
    \  - `mobile` (varchar(16), unique, nullable)\n\n- **Indexes**:\n  - `UNIQUE INDEX\
    \ idx_email_nonnull` ON `user_accounts(email)` WHERE `email IS NOT NULL`\n  -\
    \ `UNIQUE INDEX idx_mobile_nonnull` ON `user_accounts(mobile)` WHERE `mobile IS\
    \ NOT NULL`\n\n### 1.3. Validation Logic Interface\n\n- **Class**: `ValidationService`\n\
    \  - `validateEmailFormat(email: string): boolean`\n  - `validateMobileFormat(mobile:\
    \ string): boolean`\n  - `parseIdentifier(identifier: string): { type: 'email'|'mobile',\
    \ value: string } | Error`\n\n- **Class**: `UserAccountRepository`\n  - `existsByEmail(email:\
    \ string): Promise<boolean>`\n  - `existsByMobile(mobile: string): Promise<boolean>`\n\
    \  - `createUserAccount(data: { email?: string, mobile?: string }): Promise<UserAccount>`\n\
    \n---\n\n## 2. Test Strategy\n\n**Test Case 1:**  \n- **Test:** Accepts valid\
    \ email, creates user  \n- **Covers:** /register/initiate contract (`201`), data\
    \ model uniqueness, `validateEmailFormat`, `existsByEmail`  \n- **Steps:** POST\
    \ valid email → Assert `201` and user created\n\n**Test Case 2:**  \n- **Test:**\
    \ Accepts valid mobile, creates user  \n- **Covers:** /register/initiate contract\
    \ (`201`), uniqueness, `validateMobileFormat`, `existsByMobile`  \n- **Steps:**\
    \ POST valid mobile (E.164) → Assert `201` and user created\n\n**Test Case 3:**\
    \  \n- **Test:** Rejects empty identifier  \n- **Covers:** `/register/initiate`\
    \ contract (`400` \"Identifier required\")\n\n**Test Case 4:**  \n- **Test:**\
    \ Rejects invalid email  \n- **Covers:** `/register/initiate` contract (`400`\
    \ \"Invalid email format\"); `ValidationService.validateEmailFormat`\n\n**Test\
    \ Case 5:**  \n- **Test:** Rejects invalid mobile  \n- **Covers:** `/register/initiate`\
    \ contract (`400` \"Invalid mobile format.\"); `ValidationService.validateMobileFormat`\n\
    \n**Test Case 6:**  \n- **Test:** Rejects duplicate email  \n- **Covers:** `/register/initiate`\
    \ contract (`409` \"Identifier already registered.\"); `UserAccountRepository.existsByEmail`\n\
    \n**Test Case 7:**  \n- **Test:** Rejects duplicate mobile  \n- **Covers:** `/register/initiate`\
    \ contract (`409` \"Identifier already registered.\"); `UserAccountRepository.existsByMobile`\n\
    \n**Test Case 8:**  \n- **Test:** Rejects if both email and mobile provided  \n\
    - **Covers:** `/register/initiate` contract (`400` \"Provide either email or mobile,\
    \ not both.\")\n\n**Test Case 9:**  \n- **Test:** Accepts valid correction after\
    \ previous error  \n- **Covers:** Resubmission; corrects Test 4/5/8 and follows\
    \ with valid format, asserts success\n\n**Test Case 10:**  \n- **Test:** Multiple\
    \ failed attempts each yield actionable feedback  \n- **Covers:** Consistent presentation\
    \ of specific error messages over several invalid submissions\n\n---\n\n## 3.\
    \ Implementation Approach\n\n### 3.1. HTTP Controller\n\n- **Class:** `UserRegistrationController`\n\
    \  - Method: `POST /api/v1/register/initiate`\n    1. Parse body, extract `identifier`.\n\
    \    2. Pass to `ValidationService.parseIdentifier`.  \n      - If Error, respond\
    \ with `400/422` and message.\n    3. If email:\n        - `ValidationService.validateEmailFormat`\n\
    \        - `UserAccountRepository.existsByEmail`\n    4. If mobile:\n        -\
    \ `ValidationService.validateMobileFormat`\n        - `UserAccountRepository.existsByMobile`\n\
    \    5. On conflict, return `409 Conflict`.\n    6. On success, `UserAccountRepository.createUserAccount`.\n\
    \n### 3.2. Data Persistence\n\n- Use `user_accounts` table.\n- Enforce uniqueness\
    \ with partial indexes (see 1.2).\n\n### 3.3. Validation Logic\n\n- Email: RFC5322-compliant\
    \ regex in `ValidationService`.\n- Mobile: E.164-compliant regex; further region\
    \ checks MAY be handled by a pluggable NuMLib integration.\n\n### 3.4. Error Handling"
  affected_services:
  - id: S-001
  api_changes:
  - service: S-001
    endpoint: /api/v1/register/initiate
    method: POST
    change_type: Enhancement - extend input validation, improve duplicate handling
      and error reporting
gaps: []

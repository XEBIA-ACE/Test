# ============================================================================
# Bootstrap Configuration
# Loaded before main application configuration
# ============================================================================

spring:
  application:
    name: config-service

  cloud:
    # Consul bootstrap (if needed for config)
    consul:
      enabled: ${CONSUL_ENABLED:false}
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      config:
        enabled: false

    # Vault bootstrap (if needed for config)
    vault:
      enabled: ${VAULT_ENABLED:false}

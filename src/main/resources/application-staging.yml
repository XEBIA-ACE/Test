# ============================================================================
# Staging Environment Configuration
# ============================================================================

spring:
  cloud:
    config:
      server:
        git:
          uri: ${GIT_REPO_URI:https://github.com/your-org/config-repo-staging.git}
          username: ${GIT_USERNAME}
          password: ${GIT_PASSWORD}
          default-label: staging

    consul:
      enabled: true
      host: ${CONSUL_HOST:consul-staging.example.com}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        tags:
          - environment=staging
          - version=1.0.0

    vault:
      enabled: true
      host: ${VAULT_HOST:vault-staging.example.com}
      port: ${VAULT_PORT:8200}
      scheme: https
      token: ${VAULT_TOKEN}

server:
  port: 8888

config:
  security:
    username: ${CONFIG_USERNAME}
    password: ${CONFIG_PASSWORD}

logging:
  level:
    root: INFO
    com.example.configservice: INFO
    org.springframework.cloud.config: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

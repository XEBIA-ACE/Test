# Production Environment Configuration
spring:
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.orderservice: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true

management:
  endpoint:
    health:
      show-details: never

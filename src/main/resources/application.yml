# ============================================================================
# Spring Cloud Config Server - Main Configuration
# ============================================================================

spring:
  application:
    name: config-service

  # Profile configuration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Cloud Config Server settings
  cloud:
    config:
      server:
        git:
          uri: ${GIT_REPO_URI:https://github.com/your-org/config-repo.git}
          default-label: ${GIT_DEFAULT_BRANCH:main}
          username: ${GIT_USERNAME:}
          password: ${GIT_PASSWORD:}
          clone-on-start: true
          timeout: 10
          search-paths:
            - '{application}'
            - '{application}/{profile}'
          force-pull: true

        # Enable encryption/decryption endpoints
        encrypt:
          enabled: true

    # Consul Configuration
    consul:
      enabled: ${CONSUL_ENABLED:true}
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: ${CONSUL_DISCOVERY_ENABLED:true}
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}:${random.value}
        health-check-path: /actuator/health
        health-check-interval: 10s
        health-check-timeout: 5s
        prefer-ip-address: true
        tags:
          - config-server
          - version=1.0.0
      config:
        enabled: false

    # Vault Configuration
    vault:
      enabled: ${VAULT_ENABLED:false}
      host: ${VAULT_HOST:localhost}
      port: ${VAULT_PORT:8200}
      scheme: ${VAULT_SCHEME:http}
      authentication: ${VAULT_AUTH_METHOD:TOKEN}
      token: ${VAULT_TOKEN:}
      kv:
        enabled: true
        backend: secret
        default-context: application

# Server Configuration
server:
  port: ${SERVER_PORT:8888}
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always

# Security Configuration
config:
  security:
    username: ${CONFIG_USERNAME:admin}
    password: ${CONFIG_PASSWORD:changeme}

# Management & Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,configprops
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    consul:
      enabled: ${CONSUL_ENABLED:true}
    vault:
      enabled: ${VAULT_ENABLED:false}
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}

# Logging Configuration
logging:
  level:
    root: INFO
    com.example.configservice: DEBUG
    org.springframework.cloud.config: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: logs/config-service.log
    max-size: 10MB
    max-history: 30

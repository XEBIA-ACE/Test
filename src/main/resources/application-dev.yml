# ============================================================================
# Development Environment Configuration
# ============================================================================

spring:
  cloud:
    config:
      server:
        git:
          uri: ${GIT_REPO_URI:https://github.com/your-org/config-repo-dev.git}
          username: ${GIT_USERNAME:}
          password: ${GIT_PASSWORD:}

    consul:
      enabled: false  # Disable Consul in dev for local testing

    vault:
      enabled: false  # Disable Vault in dev for local testing

server:
  port: 8888

# Relaxed security for development
config:
  security:
    username: admin
    password: dev123

# Enhanced logging for development
logging:
  level:
    root: INFO
    com.example.configservice: DEBUG
    org.springframework.cloud.config: DEBUG
    org.springframework.cloud.consul: DEBUG
    org.springframework.vault: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"  # Expose all actuator endpoints in dev
  endpoint:
    health:
      show-details: always

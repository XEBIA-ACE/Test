spring:
  data:
    redis:
      host: localhost
      port: 6379
      database: 15  # Use different database for tests

jwt:
  secret: test-secret-key-that-is-long-enough-for-hmac-sha256-algorithm-requirements
  expiration-ms: 3600000
  refresh-expiration-ms: 86400000
  issuer: test-auth-service

keycloak:
  auth-server-url: http://localhost:8180/auth
  realm: test-realm
  resource: test-client
  credentials:
    secret: test-secret
  admin:
    username: admin
    password: admin

session:
  timeout-seconds: 1800

cors:
  allowed-origins: http://localhost:3000
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

logging:
  level:
    root: INFO
    com.authservice: DEBUG

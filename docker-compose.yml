version: '3.8'

# ============================================================================
# Docker Compose for Local Development Environment
# ============================================================================

services:
  # Consul - Service Discovery and Configuration
  consul:
    image: hashicorp/consul:1.17
    container_name: consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    networks:
      - config-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vault - Secrets Management
  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=myroot
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    networks:
      - config-network
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Git Server (optional - for local testing)
  # Using a simple git-over-http server for demo purposes
  git-server:
    image: gitea/gitea:1.21
    container_name: git-server
    ports:
      - "3000:3000"
      - "222:22"
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__ROOT_URL=http://localhost:3000
    volumes:
      - gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - config-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Config Service
  config-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: config-service
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - GIT_REPO_URI=${GIT_REPO_URI:-https://github.com/your-org/config-repo.git}
      - GIT_USERNAME=${GIT_USERNAME:-}
      - GIT_PASSWORD=${GIT_PASSWORD:-}
      - CONSUL_ENABLED=true
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - VAULT_ENABLED=true
      - VAULT_HOST=vault
      - VAULT_PORT=8200
      - VAULT_SCHEME=http
      - VAULT_TOKEN=myroot
      - CONFIG_USERNAME=admin
      - CONFIG_PASSWORD=admin123
      - JAVA_OPTS=-Xmx512m -Xms256m
    depends_on:
      consul:
        condition: service_healthy
      vault:
        condition: service_healthy
    networks:
      - config-network
    volumes:
      - config-logs:/var/log/config-service
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  config-network:
    driver: bridge

volumes:
  gitea-data:
  config-logs:

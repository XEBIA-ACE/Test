version: '3.8'

services:
  # Redis for session storage
  redis:
    image: redis:7.2-alpine
    container_name: auth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - auth-network

  # Keycloak for OAuth 2.0
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: auth-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
    ports:
      - "8180:8080"
    command: start-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - auth-network
    volumes:
      - keycloak-data:/opt/keycloak/data

  # Authentication Service
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authentication-service
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: authentication-service
      KEYCLOAK_RESOURCE: auth-service-client
      KEYCLOAK_CLIENT_SECRET: your-client-secret-here
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-make-it-long-and-random
      JWT_EXPIRATION_MS: 3600000
      JWT_REFRESH_EXPIRATION_MS: 86400000
      SESSION_TIMEOUT_SECONDS: 1800
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:4200
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_APP: DEBUG
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - auth-network

networks:
  auth-network:
    driver: bridge

volumes:
  redis-data:
  keycloak-data:

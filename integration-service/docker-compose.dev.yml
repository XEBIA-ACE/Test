version: '3.8'

services:
  # Development setup with hot reload
  integration-service-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: integration-service-dev
    ports:
      - "3000:3000"
      - "9090:9090"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: integration_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      LOG_LEVEL: debug
    depends_on:
      - postgres
      - redis
      - kafka
      - rabbitmq
    networks:
      - integration-network
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    command: npm run dev

networks:
  integration-network:
    external: true
